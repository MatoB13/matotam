name: dolz-data-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the DOLZ report with gap filling
        run: |
          mkdir -p /tmp/h && cp src/app/lib/{dolzPortfolio,dolzMarket,dolzMarketSeed,dolzPriceSeed,blockscout,polygonRpc}.ts /tmp/h/
          cd /tmp/h && sed -i -E 's#from "\./(dolzMarket|dolzMarketSeed|dolzPriceSeed|blockscout|polygonRpc)"#from "./\1.ts"#' *.ts
          cat > run.ts <<'TS'
          import { getDolzReport, fetchWalletTransfers, fillIndexGaps, DEFAULT_DOLZ_WALLETS } from "./dolzPortfolio.ts";
          const indexed = (await Promise.all(DEFAULT_DOLZ_WALLETS.map((w) => fetchWalletTransfers(w)))).flat();
          const gaps = await fillIndexGaps(indexed, DEFAULT_DOLZ_WALLETS);
          console.log("indexed transfers", indexed.length, "added from chain", gaps.added.length, "tx details", gaps.details.length);
          const nft = gaps.added.filter((t) => t.tokenId);
          console.log("added NFT transfers", nft.length, nft.slice(0, 60).map((t) => `${t.ts.slice(0, 10)} #${t.tokenId} ${t.from.slice(0, 8)}>${t.to.slice(0, 8)} ${t.method}`).join("\n"));
          const r = await getDolzReport();
          const t = r.totals;
          const f = (n: number) => Math.round(n);
          console.log(JSON.stringify({ invested: f(t.investedUsd), proceeds: f(t.proceedsUsd), realized: f(t.realizedUsd), book: f(t.bookUsd), mark: f(t.markUsd), pnl: f(t.pnlAtMarkUsd), holdings: t.holdings, acquired: t.acquired, sold: t.sold, sources: t.valuationSources }));
          console.log("DolzNFT held", r.holdings.filter((h) => h.collection === "DolzNFT").length, "other", r.holdings.filter((h) => h.collection !== "DolzNFT").length);
          console.log(r.events.filter((e) => e.tokens.some((x) => x.id === "251")).map((e) => `${e.ts.slice(0, 10)} ${e.type} ${e.paidWith} ${Math.round(e.usd)}`).join("\n"));
          console.log(r.channels.map((c) => `${c.channel} bought ${c.bought} spent ${Math.round(c.spentUsd)} sold ${c.sold} proceeds ${Math.round(c.proceedsUsd)}`).join("\n"));
          TS
          node run.ts
